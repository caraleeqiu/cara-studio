name = "cara-studio-chat"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# 只允许这些来源调用，防止别人拿去当免费 API。
# 上线后把线上域名填进来，本地开发保留 localhost。
ALLOWED_ORIGINS = "http://localhost:8788,https://cara-studio.pages.dev"

# GEMINI_API_KEY 不写在这里 —— 用命令注入，避免进版本库：
#   npx wrangler secret put GEMINI_API_KEY

# 留言墙的存储。创建一次拿到 id 填这里：
#   npx wrangler kv namespace create NOTES
[[kv_namespaces]]
binding = "NOTES"
id = "填入 wrangler kv namespace create 返回的 id"
